<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parkour 1v1 em Tempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #111; color: white; overflow: hidden; }
        
        #lobby-screen { text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid #333; }
        h1 { font-size: 1.8rem; margin-bottom: 15px; color: #2ecc71; text-shadow: 2px 2px 0 #27ae60; }
        button { background: #2ecc71; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; margin: 8px; font-weight: bold; width: 100%; max-width: 250px; box-shadow: 0 4px 0 #27ae60; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #27ae60; }
        
        #btn-start-game { background: #e67e22; box-shadow: 0 4px 0 #d35400; display: none; margin-top: 15px; }

        input { padding: 12px; font-size: 1.2rem; border-radius: 10px; border: 2px solid #555; background: #222; width: 100%; max-width: 250px; text-align: center; margin-bottom: 10px; color: #fff; font-weight: bold;}
        .input-codigo { letter-spacing: 2px; font-size: 1.5rem !important; }
        
        #waiting-msg { display: none; font-size: 1.1rem; color: #aaa; }
        
        /* TELA DO JOGO */
        #game-screen { display: none; flex-direction: column; width: 100%; height: 100%; justify-content: space-between; align-items: center; background: #1a1a1a; position: relative; }
        
        #header-hud { display: flex; justify-content: space-between; width: 100%; max-width: 400px; padding: 10px 20px; background: rgba(0,0,0,0.5); font-weight: bold; font-size: 1rem; z-index: 10; }
        
        /* Canvas do Jogo */
        #parkour-canvas { background: #111; border-left: 2px solid #333; border-right: 2px solid #333; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        #result-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; text-align: center; }
        #result-text { font-size: 2rem; margin-bottom: 20px; color: #f1c40f; }
    </style>
</head>
<body>

    <div id="lobby-screen">
        <h1>Parkour 1v1 🏃‍♂️💨</h1>
        <div id="menu-principal">
            <input type="text" id="nome-input" placeholder="Seu Nome" maxlength="10">
            <br>
            <button onclick="criarSala()">Criar Sala (Host)</button>
            <p style="margin: 8px 0; color: #777;">ou</p>
            <input type="number" id="codigo-input" class="input-codigo" placeholder="Código (4 dígitos)" maxlength="4">
            <br>
            <button onclick="entrarSala()">Entrar na Sala</button>
        </div>
        <div id="waiting-msg">
            Status: <span id="status-conexao" style="color: #f39c12; font-weight: bold;">Aguardando o oponente...</span><br>
            <span id="meu-codigo" style="font-size: 2.2rem; color: #2ecc71; font-weight: bold; display:inline-block; margin-top:10px; letter-spacing: 3px;"></span>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #aaa;">Passe este código para o outro jogador!</p>
            
            <button id="btn-start-game" onclick="iniciarPartidaHost()">Iniciar Jogo 🚀</button>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-screen">
        <div id="header-hud">
            <span id="hud-p1" style="color: #e74c3c;">P1: 0m</span>
            <span id="hud-p2" style="color: #3498db;">P2: 0m</span>
        </div>
        
        <canvas id="parkour-canvas"></canvas>

        <div id="result-overlay">
            <div id="result-text">Fim de Jogo!</div>
            <button onclick="location.reload()">Jogar Novamente</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <script>
        let peer;
        let conn;
        
        let meuNome = "";
        let meuIdNoJogo = 'p1';
        let ehHost = false;
        let jogoAtivo = false;

        const lobbyScreen = document.getElementById('lobby-screen');
        const menuPrincipal = document.getElementById('menu-principal');
        const waitingMsg = document.getElementById('waiting-msg');
        const nomeInput = document.getElementById('nome-input');
        const meuCodigoEl = document.getElementById('meu-codigo');
        const statusConexao = document.getElementById('status-conexao');
        const codigoInput = document.getElementById('codigo-input');
        const btnStartGame = document.getElementById('btn-start-game');
        const gameScreen = document.getElementById('game-screen');
        const resultOverlay = document.getElementById('result-overlay');
        const resultText = document.getElementById('result-text');
        
        const canvas = document.getElementById('parkour-canvas');
        const ctx = canvas.getContext('2d');

        // Configuração do tamanho da tela do jogo
        canvas.width = 360;
        canvas.height = 500;

        // Dados dos jogadores e obstáculos
        let p1 = { x: 100, y: 400, largura: 25, altura: 25, velocidadeX: 0, cor: '#e74c3c', distancia: 0, vivo: true };
        let p2 = { x: 230, y: 400, largura: 25, altura: 25, velocidadeX: 0, cor: '#3498db', distancia: 0, vivo: true };
        let obstaculos = [];
        let inputMovimento = 0; // -1 esquerda, 1 direita, 0 parado

        function criarSala() {
            validarNome();
            if(!meuNome) return;
            ehHost = true;
            meuIdNoJogo = 'p1';

            const codigoCurto = "pk-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(codigoCurto);

            peer.on('open', (id) => {
                meuCodigoEl.innerText = id.replace("pk-", "");
                menuPrincipal.style.display = 'none';
                waitingMsg.style.display = 'block';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                statusConexao.style.color = "#2ecc71";
                statusConexao.innerText = "Oponente conectado! Pronto.";
                btnStartGame.style.display = "inline-block";
                
                conn.on('open', () => {
                    conn.send({ tipo: 'atribuir_papel', papel: 'p2' });
                });

                conn.on('data', (data) => {
                    if (data.tipo === 'input') {
                        p2.velocidadeX = data.velX;
                    } else if (data.tipo === 'morreu') {
                        p2.vivo = false;
                        verificarFimDeJogo();
                    }
                });
            });
            peer.on('error', () => { criarSala(); });
        }

        function entrarSala() {
            validarNome();
            if(!meuNome) return;
            const digitado = codigoInput.value.trim();
            if(!digitado) { alert('Digite o código!'); return; }
            
            ehHost = false;
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect("pk-" + digitado);
                conn.on('open', () => {
                    menuPrincipal.style.display = 'none';
                    waitingMsg.style.display = 'block';
                    statusConexao.innerText = "Conectado! Aguardando Host iniciar...";
                });
                conn.on('data', (data) => {
                    if (data.tipo === 'atribuir_papel') {
                        meuIdNoJogo = data.papel;
                    } else if (data.tipo === 'iniciar_jogo') {
                        iniciarJogoVisual();
                    } else if (data.tipo === 'estado_jogo') {
                        // Sincroniza posições enviadas pelo host
                        p1.x = data.p1x; p1.distancia = data.p1dist;
                        p2.x = data.p2x; p2.distancia = data.p2dist;
                        obstaculos = data.obs;
                        atualizarHUD(data.p1dist, data.p2dist);
                    } else if (data.tipo === 'morreu') {
                        p1.vivo = false;
                        verificarFimDeJogo();
                    } else if (data.tipo === 'fim_jogo') {
                        mostrarFimDeJogo(data.texto);
                    }
                });
            });
        }

        function validarNome() {
            let n = nomeInput.value.trim();
            meuNome = n ? n : '';
            if(!meuNome) alert('Digite seu nome!');
        }

        function iniciarPartidaHost() {
            transmitirParaOponente({ tipo: 'iniciar_jogo' });
            iniciarJogoVisual();
        }

        function iniciarJogoVisual() {
            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            jogoAtivo = true;
            
            // Inicia o loop do jogo
            requestAnimationFrame(loopDoJogo);
        }

        // Controles por Toque (Celular)
        window.addEventListener('pointerdown', (e) => {
            if (!jogoAtivo) return;
            if (e.clientX < window.innerWidth / 2) {
                inputMovimento = -5; // Esquerda
            } else {
                inputMovimento = 5; // Direita
            }
            enviarInput();
        });

        window.addEventListener('pointerup', () => {
            if (!jogoAtivo) return;
            inputMovimento = 0;
            enviarInput();
        });

        // Controles por Teclado (PC)
        window.addEventListener('keydown', (e) => {
            if (!jogoAtivo) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') inputMovimento = -5;
            if (e.key === 'ArrowRight' || e.key === 'd') inputMovimento = 5;
            enviarInput();
        });

        window.addEventListener('keyup', (e) => {
            if (!jogoAtivo) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') {
                inputMovimento = 0;
            }
            enviarInput();
        });

        function enviarInput() {
            let meuObj = (meuIdNoJogo === 'p1') ? p1 : p2;
            meuObj.velocidadeX = inputMovimento;

            if (conn && conn.open) {
                conn.send({ tipo: 'input', velX: inputMovimento });
            }
        }

        let contadorObs = 0;
        function loopDoJogo() {
            if (!jogoAtivo) return;

            // Movimenta os jogadores
            p1.x += p1.velocidadeX;
            p2.x += p2.velocidadeX;

            // Limites das paredes laterais
            if (p1.x < 0) p1.x = 0; if (p1.x > canvas.width - p1.largura) p1.x = canvas.width - p1.largura;
            if (p2.x < 0) p2.x = 0; if (p2.x > canvas.width - p2.largura) p2.x = canvas.width - p2.largura;

            if (ehHost) {
                p1.distancia++;
                p2.distancia++;

                // Cria novos obstáculos descendo
                contadorObs++;
                if (contadorObs % 45 === 0) {
                    let larguraObs = 80 + Math.random() * 100;
                    let xObs = Math.random() * (canvas.width - larguraObs);
                    obstaculos.push({ x: xObs, y: -20, largura: larguraObs, altura: 18 });
                }

                // Move os obstáculos para baixo
                for (let i = obstaculos.length - 1; i >= 0; i--) {
                    obstaculos[i].y += 4;

                    // Verifica colisão com P1
                    if (colide(p1, obstaculos[i])) {
                        p1.vivo = false;
                        transmitirParaOponente({ tipo: 'morreu' });
                        verificarFimDeJogo();
                    }
                    // Verifica colisão com P2
                    if (colide(p2, obstaculos[i])) {
                        p2.vivo = false;
                        transmitirParaOponente({ tipo: 'morreu' });
                        verificarFimDeJogo();
                    }

                    // Remove obstáculo que saiu da tela
                    if (obstaculos[i].y > canvas.height) {
                        obstaculos.splice(i, 1);
                    }
                }

                // Envia o estado atual para o oponente
                transmitirParaOponente({
                    tipo: 'estado_jogo',
                    p1x: p1.x, p1dist: p1.distancia,
                    p2x: p2.x, p2dist: p2.distancia,
                    obs: obstaculos
                });

                atualizarHUD(p1.distancia, p2.distancia);
            }

            // Desenha na tela
            desenharCenario();

            if (jogoAtivo) {
                requestAnimationFrame(loopDoJogo);
            }
        }

        function colide(jogador, obs) {
            // Como o jogador fica fixo verticalmente na altura 380 e os blocos descem:
            let jogadorY = 380;
            return (
                jogador.x < obs.x + obs.largura &&
                jogador.x + jogador.largura > obs.x &&
                jogadorY < obs.y + obs.altura &&
                jogadorY + jogador.altura > obs.y
            );
        }

        function desenharCenario() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha linhas de fundo estilo grid de parkour
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            // Desenha os Obstáculos
            ctx.fillStyle = '#e74c3c';
            obstaculos.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.largura, obs.altura);
            });

            // Desenha Jogador 1 (Vermelho)
            if (p1.vivo) {
                ctx.fillStyle = p1.cor;
                ctx.fillRect(p1.x, 380, p1.largura, p1.altura);
            }

            // Desenha Jogador 2 (Azul)
            if (p2.vivo) {
                ctx.fillStyle = p2.cor;
                ctx.fillRect(p2.x, 380, p2.largura, p2.altura);
            }
        }

        function atualizarHUD(d1, d2) {
            document.getElementById('hud-p1').innerText = `${meuNome || 'P1'}: ${d1}m`;
            document.getElementById('hud-p2').innerText = `Oponente: ${d2}m`;
        }

        function verificarFimDeJogo() {
            if (!p1.vivo || !p2.vivo) {
                jogoAtivo = false;
                let texto = "";
                if (!p1.vivo && !p2.vivo) texto = "Empate! Bateram juntos!";
                else if (!p1.vivo) texto = "Oponente Venceu!";
                else texto = "Você Venceu o Parkour! 🏆";

                if (ehHost) {
                    transmitirParaOponente({ tipo: 'fim_jogo', texto: (p1.vivo ? "Você Venceu!" : "Oponente Venceu!") });
                }
                mostrarFimDeJogo(texto);
            }
        }

        function mostrarFimDeJogo(texto) {
            jogoAtivo = false;
            resultOverlay.style.display = 'flex';
            resultText.innerText = texto;
        }

        function transmitirParaOponente(dados) {
            if (conn && conn.open) conn.send(dados);
        }
    </script>
</body>
</html>
